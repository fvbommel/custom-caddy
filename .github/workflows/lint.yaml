name: Lint

on:
  schedule:
    - cron: "8 18 * * *"
      timezone: "Europe/Amsterdam"
  push:
    branches: ["main"]
    paths-ignore:
      - ".github/dependabot.yml"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - ".github/dependabot.yml"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: "go.mod"
          check-latest: false
